[package]
org = "ballerinax"
name = "temporal"
version = "1.0.0"
authors = ["Ballerina"]
keywords = ["temporal", "workflow", "orchestration"]
repository = "https://github.com/ballerina-platform/module-ballerinax-temporal"
license = ["Apache-2.0"]
distribution = "1.0.0-SNAPSHOT"
export = ["temporal"]


[build-options]
observabilityIncluded = true

[platform.java21]
graalvmCompatible = true

[[platform.java21.dependency]]
path = "../native/build/libs/temporal-native-1.0.0-SNAPSHOT.jar"
groupId = "io.ballerina.stdlib"
artifactId = "temporal-native"
version = "1.0.0-SNAPSHOT"

[[platform.java21.dependency]]
path = "../commons/build/libs/temporal-commons-1.0.0-SNAPSHOT.jar"
groupId = "io.ballerina.stdlib"
artifactId = "temporal-commons"
version = "1.0.0-SNAPSHOT"

[[platform.java21.dependency]]
groupId = "io.temporal"
artifactId = "temporal-sdk"
version = "1.20.0"

[[platform.java21.dependency]]
groupId = "org.slf4j"
artifactId = "slf4j-api"
version = "1.7.36"

[[platform.java21.dependency]]
groupId = "org.slf4j"
artifactId = "slf4j-simple"
version = "1.7.36"